name: Check site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec ruby _scripts/test_check_redirects.rb
      - run: bundle exec ruby _scripts/check_redirects.rb
      - run: bundle exec jekyll build
